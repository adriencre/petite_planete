<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petite planète – ambiances</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
  body { background: var(--sky); transition: background .8s; }
  canvas { display: block; }
  #ui { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
  #ui button { border: 0; border-radius: 999px; padding: 10px 16px; font-size: 14px; cursor: pointer;
    background: rgba(255,255,255,.55); color: #222; backdrop-filter: blur(6px); }
  #ui button[aria-pressed="true"] { background: #fff; font-weight: 600; }
  #title { position: fixed; top: 20px; left: 0; right: 0; text-align: center; color: var(--ink); font-size: 22px; font-weight: 600; letter-spacing: .02em; }
  #sub { display: block; font-size: 14px; font-weight: 400; opacity: .75; margin-top: 4px; }
</style>
</head>
<body>
<div id="title"><span id="name"></span><span id="sub"></span></div>
<div id="ui"></div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from "three";

// 4 ambiances : seules les couleurs et la lumière changent
const MOODS = [
  { name: "Aube pastel", sub: "doux, rose et vert tendre", sky: "linear-gradient(#f7d9d0, #fbeee0)", ink: "#5a4a52",
    ground: 0xa8d5a2, ground2: 0x93c48f, leaf: 0xf2a7b8, leaf2: 0xf7c6cf, trunk: 0x8d6e63, rock: 0xd9cfc1, ruin: 0xeee4d6,
    robot: 0xfafafa, eye: 0x4fd1c5, sun: 0xffe2c8, sunI: 2.6, hemiSky: 0xfff0f0, hemiGround: 0x9fbf9a, hemiI: 1.4, fire: 1, stars: false },
  { name: "Coucher doré", sub: "chaud, nostalgique, feu de camp", sky: "linear-gradient(#f4a261, #f9d9a6)", ink: "#5b3a1e",
    ground: 0xd4a95f, ground2: 0xc29350, leaf: 0xe76f51, leaf2: 0xf4a261, trunk: 0x6d4c41, rock: 0x9c7a64, ruin: 0xe9d3b0,
    robot: 0xf5ece0, eye: 0x2ec4b6, sun: 0xffb37a, sunI: 3.0, hemiSky: 0xffd6a5, hemiGround: 0x8d5a3b, hemiI: 1.1, fire: 2, stars: false },
  { name: "Nuit étoilée", sub: "calme, mystérieux, lumière du feu", sky: "linear-gradient(#0f1533, #2b3a6b)", ink: "#e8ecff",
    ground: 0x3d5a80, ground2: 0x34506f, leaf: 0x2a9d8f, leaf2: 0x52c7b8, trunk: 0x3b2f2f, rock: 0x5c6784, ruin: 0x8792b0,
    robot: 0xdfe6ff, eye: 0xffd166, sun: 0x9fb4ff, sunI: 1.2, hemiSky: 0x5a6fb0, hemiGround: 0x1b2440, hemiI: 0.9, fire: 6, stars: true },
  { name: "Brume turquoise", sub: "frais, aérien, presque irréel", sky: "linear-gradient(#bfe6e2, #eef7f2)", ink: "#2f5550",
    ground: 0x7fc8b8, ground2: 0x6db5a6, leaf: 0xfefae0, leaf2: 0xe9f5db, trunk: 0x6c8ea4, rock: 0x6c8ea4, ruin: 0xf1f1ea,
    robot: 0xffffff, eye: 0xff8fab, sun: 0xffffff, sunI: 2.2, hemiSky: 0xeafffb, hemiGround: 0x5f9e94, hemiI: 1.6, fire: 0.6, stars: false },
];

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera();
cam.position.set(20, 16, 20);   // vue isométrique
cam.lookAt(0, 0, 0);

const hemi = new THREE.HemisphereLight();
scene.add(hemi);
const sun = new THREE.DirectionalLight();
sun.position.set(8, 14, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9 });
sun.shadow.radius = 4;
scene.add(sun);

const flat = (color) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: .9 });
const mats = {};
for (const k of ["ground", "ground2", "leaf", "leaf2", "trunk", "rock", "ruin", "robot"]) mats[k] = flat(0xffffff);
mats.eye = new THREE.MeshStandardMaterial({ color: 0, emissive: 0xffffff, emissiveIntensity: 2 });
mats.fire = new THREE.MeshStandardMaterial({ color: 0xffb347, emissive: 0xff7a1a, emissiveIntensity: 2, flatShading: true });

// planète : icosphère cabossée, tout tourne lentement autour
const planet = new THREE.Group();
const tilt = new THREE.Group(); // incline le pôle (où vit le décor) vers la caméra
tilt.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 1, 0).lerp(cam.position.clone().normalize(), .5).normalize());
tilt.position.y = -3.2;
tilt.add(planet); scene.add(tilt);
const R = 6;
const geo = new THREE.IcosahedronGeometry(R, 3);
const pos = geo.attributes.position, v = new THREE.Vector3();
const bump = (p) => 1 + 0.035 * Math.sin(p.x * 1.3) * Math.cos(p.z * 1.1) + 0.02 * Math.sin(p.y * 2.1 + p.x);
for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i); v.multiplyScalar(bump(v.clone().normalize().multiplyScalar(R))); pos.setXYZ(i, v.x, v.y, v.z); }
geo.computeVertexNormals();
const ground = new THREE.Mesh(geo, mats.ground);
ground.receiveShadow = true;
planet.add(ground);

// pose un objet sur la surface, orienté vers l'extérieur
function place(obj, lat, lon, sink = 0.05) {
  const n = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(lat), THREE.MathUtils.degToRad(lon));
  obj.position.copy(n).multiplyScalar(R * bump(n.clone().multiplyScalar(R)) - sink);
  obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), n);
  obj.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  planet.add(obj);
  return obj;
}
const mesh = (g, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); return o; };

function tree(s = 1, alt = false) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(.08 * s, .12 * s, .7 * s, 5), mats.trunk, 0, .35 * s));
  g.add(mesh(new THREE.ConeGeometry(.55 * s, 1.1 * s, 6), alt ? mats.leaf2 : mats.leaf, 0, 1.1 * s));
  g.add(mesh(new THREE.ConeGeometry(.42 * s, .8 * s, 6), alt ? mats.leaf2 : mats.leaf, 0, 1.55 * s));
  return g;
}
function roundTree(s = 1, alt = false) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(.07 * s, .1 * s, .8 * s, 5), mats.trunk, 0, .4 * s));
  g.add(mesh(new THREE.IcosahedronGeometry(.55 * s, 0), alt ? mats.leaf2 : mats.leaf, 0, 1.05 * s));
  return g;
}
const rock = (s) => { const r = mesh(new THREE.DodecahedronGeometry(.35 * s, 0), mats.rock); r.scale.y = .7; r.rotation.y = s * 3; return r; };

function ruin() {
  const g = new THREE.Group();
  const pillar = (x, z, h) => g.add(mesh(new THREE.BoxGeometry(.35, h, .35), mats.ruin, x, h / 2, z));
  pillar(-.6, -.3, 1.4); pillar(.6, -.3, 1.1); pillar(-.6, .5, .6);
  const lintel = mesh(new THREE.BoxGeometry(1.6, .25, .4), mats.ruin, 0, 1.45, -.3);
  lintel.rotation.z = -.12; g.add(lintel);
  g.add(mesh(new THREE.BoxGeometry(.4, .25, .3), mats.ruin, .3, .12, .5));
  return g;
}

function robot() {
  const g = new THREE.Group();
  const body = new THREE.Group(); g.add(body);
  body.add(mesh(new THREE.CylinderGeometry(.28, .34, .55, 8), mats.robot, 0, .5));
  body.add(mesh(new THREE.SphereGeometry(.3, 10, 8), mats.robot, 0, 1.0));
  body.add(mesh(new THREE.SphereGeometry(.08, 8, 6), mats.eye, .12, 1.02, .22));
  body.add(mesh(new THREE.SphereGeometry(.08, 8, 6), mats.eye, -.12, 1.02, .22));
  body.add(mesh(new THREE.CylinderGeometry(.015, .015, .3, 4), mats.trunk, 0, 1.38));
  body.add(mesh(new THREE.SphereGeometry(.05, 6, 4), mats.eye, 0, 1.55));
  g.add(mesh(new THREE.CylinderGeometry(.12, .12, .25, 6), mats.trunk, .17, .12));
  g.add(mesh(new THREE.CylinderGeometry(.12, .12, .25, 6), mats.trunk, -.17, .12));
  g.userData.body = body;
  return g;
}

function campfire() {
  const g = new THREE.Group();
  for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2; g.add(mesh(new THREE.DodecahedronGeometry(.1, 0), mats.rock, Math.cos(a) * .3, .05, Math.sin(a) * .3)); }
  const f1 = mesh(new THREE.ConeGeometry(.16, .5, 5), mats.fire, 0, .25);
  const f2 = mesh(new THREE.ConeGeometry(.1, .35, 5), mats.fire, .08, .18, .05);
  g.add(f1, f2);
  const light = new THREE.PointLight(0xff9a4a, 1, 6, 1.6);
  light.position.y = .6; g.add(light);
  g.userData = { flames: [f1, f2], light };
  return g;
}

// décor (lat 0 = sommet, visible depuis la caméra)
const bot = place(robot(), 4, 30);
bot.rotateY(0.9);
const fire = place(campfire(), 16, 110);
place(ruin(), 24, 345).rotateY(.4);
[[20, 70, 1.1], [30, 40, .9, 1], [12, 200, 1.2, 1], [28, 160, .8], [34, 250, 1], [22, 285, .9, 1], [40, 120, 1.1], [38, 15, .8, 1], [45, 320, 1]]
  .forEach(([la, lo, s, a], i) => place(i % 3 ? tree(s, a) : roundTree(s, a), la, lo));
[[10, 300, 1.2], [26, 210, 1], [18, 135, .7], [35, 85, 1.3], [42, 190, .9], [8, 150, .6]].forEach(([la, lo, s]) => place(rock(s), la, lo));
for (let i = 0; i < 40; i++) { // herbes
  const b = mesh(new THREE.ConeGeometry(.05, .3, 3), mats.ground2);
  place(b, 6 + (i * 37) % 50, (i * 97) % 360, 0).translateY(.12);
}

// étoiles (visibles seulement la nuit)
const sg = new THREE.BufferGeometry(), sp = [];
for (let i = 0; i < 500; i++) { const p = new THREE.Vector3().randomDirection().multiplyScalar(40 + Math.random() * 20); sp.push(p.x, p.y, p.z); }
sg.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
const stars = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false }));
scene.add(stars);

let mood;
function setMood(i) {
  mood = MOODS[i];
  for (const k in mats) if (k in mood) mats[k].color.set(mood[k]);
  mats.eye.emissive.set(mood.eye);
  sun.color.set(mood.sun); sun.intensity = mood.sunI;
  hemi.color.set(mood.hemiSky); hemi.groundColor.set(mood.hemiGround); hemi.intensity = mood.hemiI;
  fire.userData.light.intensity = mood.fire;
  stars.visible = mood.stars;
  document.body.style.setProperty("--sky", mood.sky);
  document.body.style.setProperty("--ink", mood.ink);
  document.getElementById("name").textContent = mood.name;
  document.getElementById("sub").textContent = mood.sub;
  document.querySelectorAll("#ui button").forEach((b, j) => b.setAttribute("aria-pressed", j === i));
}
const ui = document.getElementById("ui");
MOODS.forEach((m, i) => { const b = document.createElement("button"); b.textContent = m.name; b.onclick = () => setMood(i); ui.appendChild(b); });
setMood(+new URLSearchParams(location.search).get("s") || 0);

function resize() {
  const w = innerWidth, h = innerHeight, a = w / h, size = 6.5;
  Object.assign(cam, { left: -size * a, right: size * a, top: size, bottom: -size });
  if (a < 1) Object.assign(cam, { left: -size, right: size, top: size / a, bottom: -size / a });
  cam.updateProjectionMatrix();
  renderer.setSize(w, h);
}
addEventListener("resize", resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  planet.rotation.y = t * 0.04;
  bot.userData.body.position.y = Math.sin(t * 2) * .04;
  fire.userData.flames.forEach((f, i) => f.scale.y = 1 + Math.sin(t * 9 + i * 2) * .15);
  fire.userData.light.intensity = mood.fire * (0.85 + Math.sin(t * 13) * .1 + Math.sin(t * 7) * .05);
  stars.rotation.y = t * 0.01;
  renderer.render(scene, cam);
});
</script>
</body>
</html>
