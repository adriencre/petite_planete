   Une page d'écolière : lignes bleues, marge rose, écriture d'enfant qui penche. */
.page {
  inset: 40px 46px 46px;
  transform: rotate(-1.2deg);
  clip-path: polygon(0 .6%, 30% 0, 66% .8%, 100% 0, 99.6% 52%, 100% 100%, 62% 99.4%, 27% 100%, .3% 99.2%);
  background:
    linear-gradient(90deg, transparent 96px, #e59aa6aa 97px 99px, transparent 100px),
    repeating-linear-gradient(0deg, transparent 0 63px, #8fb5c86b 64px 66px),
    radial-gradient(ellipse at 88% 92%, #c4a06a55, transparent 36%),
    linear-gradient(104deg, #fbf3df, #f6ead0 70%, #ecdcb9);
  color: #3e3a63;
  font: 500 46px/66px Caveat, cursive;
  padding: 38px 40px 0 120px;
}
.page p { margin: 0; white-space: nowrap; }
.p1 { transform: rotate(-1.5deg); }
.p2 { transform: rotate(.8deg); letter-spacing: .5px; }
.p3 { transform: rotate(-.6deg); }
.p4 { transform: rotate(1.4deg); }
.p5 { transform: rotate(-1deg); }
.p6 { transform: rotate(.5deg); }
.p7 { transform: rotate(-1.8deg); }
.p8 { transform: rotate(1deg); }
.gros { font-weight: 600; font-size: 54px; }
.dessin-coucou { position: absolute; left: 120px; right: 40px; bottom: 20px; height: 230px; }
</style>

<main class="feuille page">
<p class="p1">Papa dit on part ce soir avec la Nef.</p>
<p class="p2"><span class="gros">TOUT LE MONDE.</span><br>même les arbres on les laisse.</p>
<p class="p3">mes amis viennent que quand il fait noir.</p>
<p class="p4">ici il fait jamais noir. ☹</p>
<p class="p5">Iris elle les voit aussi.</p>
<p class="p6">elle dit faut pas avoir peur du noir.</p>
<p class="p7">je vais leur dire au revoir</p>
<p class="p8">au coin noir. après je pars. promis.</p>
