<!doctype html>
<!-- Lettre : l'ordre d'Ysolde, posé sur la table de chevet, à côté du berceau (ILE_01_REVEIL.md §7).
     Un document officiel des Semeurs, plié en trois, scellé à la cire. Rendu : 1400 × 1000. -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="commun.css">
<style>
  .feuille { inset: 34px 46px 40px 40px; transform: rotate(-0.8deg); border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(120,90,50,.25) inset;
    background:
      linear-gradient(180deg, transparent 32.8%, rgba(120,90,50,.13) 33.2%, rgba(255,255,255,.18) 33.8%, transparent 35%),
      linear-gradient(180deg, transparent 65.8%, rgba(120,90,50,.13) 66.2%, rgba(255,255,255,.18) 66.8%, transparent 68%),
      radial-gradient(ellipse at 12% 85%, rgba(190,150,95,.22), transparent 35%),
      radial-gradient(ellipse at 90% 10%, rgba(190,150,95,.18), transparent 30%),
      radial-gradient(ellipse at 50% 50%, #f7efdc 55%, #e8d8b6 100%); }
  .liseré { position: absolute; inset: 22px; border: 1.5px solid var(--or); opacity: .7; }
  .tete { position: absolute; top: 46px; left: 0; right: 0; text-align: center; }
  .embleme { width: 92px; height: 92px; }
  .ordre { font-family: 'IM Fell English SC', serif; font-size: 40px; letter-spacing: 6px; color: var(--encre); margin-top: 2px; }
  .a { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 25px; color: var(--encre-pale); margin-top: 4px; }
  .message { position: absolute; top: 380px; left: 80px; right: 80px; text-align: center;
    font-family: 'Dancing Script', cursive; font-weight: 600; font-size: 84px; line-height: 1.08; color: #3f2a1c; transform: rotate(-1.5deg); }
  .signe { position: absolute; right: 250px; bottom: 92px; text-align: center; }
  .signe .nom { font-family: 'Mrs Saint Delafield', cursive; font-size: 120px; line-height: .8; color: #3f2a1c; }
  .signe .titre { font-family: 'IM Fell English SC', serif; font-size: 23px; letter-spacing: 4px; color: var(--encre-pale); margin-top: 34px; }
  .cachet { position: absolute; right: 70px; bottom: 70px; width: 170px; height: 170px; }
  .ruban { position: absolute; right: 120px; bottom: 30px; width: 90px; height: 120px; }
</style></head>
<body>
<div class="feuille">
  <svg class="grain" xmlns="http://www.w3.org/2000/svg"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0.3 0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  <svg width="0" height="0" style="position:absolute"><defs>
    <filter id="crayon" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="5" result="b"/><feDisplacementMap in="SourceGraphic" in2="b" scale="2.6"/></filter>
    <filter id="cire" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="16"/></filter>
    <radialGradient id="rouge" cx=".4" cy=".35"><stop offset="0" stop-color="#d0644a"/><stop offset=".7" stop-color="#a8432f"/><stop offset="1" stop-color="#7e2d20"/></radialGradient>
    <!-- l'emblème des Semeurs : une graine qui germe dans un soleil -->
    <g id="semeurs" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle r="30"/>
      <path d="M0 -38 v-8 M0 38 v8 M-38 0 h-8 M38 0 h8 M27 -27 l6 -6 M-27 27 l-6 6 M27 27 l6 6 M-27 -27 l-6 -6"/>
      <path d="M0 18 C-2 6 2 -4 0 -14"/>
      <path d="M0 -2 C-10 -4 -16 -12 -16 -20 C-6 -18 0 -12 0 -2 Z"/>
      <path d="M0 -8 C8 -10 14 -18 14 -24 C6 -22 0 -16 0 -8 Z"/>
      <ellipse cx="0" cy="20" rx="8" ry="5"/>
    </g>
  </defs></svg>
  <div class="liseré"></div>

  <div class="tete">
    <svg class="embleme" viewBox="-50 -50 100 100"><g filter="url(#crayon)"><circle r="30" fill="#e6c06a" opacity=".35"/><use href="#semeurs" stroke="#c89a3f" stroke-width="3"/></g></svg>
    <div class="ordre">Ordre de la Commandante</div>
    <div class="a">au petit jardinier de l'Île du Réveil</div>
  </div>

  <div class="message">Garder la lumière<br>jusqu'à notre retour.</div>

  <div class="signe">
    <div class="nom">Ysolde</div>
    <div class="titre">Commandante des Semeurs</div>
  </div>

  <svg class="ruban" viewBox="0 0 90 120"><g filter="url(#crayon)"><path d="M20 0 L30 110 L42 92 L52 112 L62 0 Z" fill="#9fb88e" stroke="#6d8a5e" stroke-width="2"/></g></svg>
  <svg class="cachet" viewBox="-85 -85 170 170">
    <g filter="url(#cire)"><circle r="66" fill="url(#rouge)"/><circle r="72" fill="#a8432f" opacity=".5"/></g>
    <circle r="46" fill="none" stroke="#7e2d20" stroke-width="3" opacity=".7"/>
    <g transform="scale(1.1)"><use href="#semeurs" stroke="#6e2419" stroke-width="3.4"/></g>
    <ellipse cx="-22" cy="-30" rx="16" ry="8" fill="#fff" opacity=".18" transform="rotate(-30)"/>
  </svg>
</div>
</body></html>
