<!doctype html>
<!-- Le plan de l'archipel des Semeurs, au mur de la salle du conseil (ILE_03_COLONIE.md §7, validé le 2026-11-16).
     Les îles nommées par les Semeurs (mêmes contours que assets/affiches/carte_archipel.svg). Au nord-ouest,
     là où devrait être la maison d'Iris, une petite tache d'encre : on croit à un accident. Rendu : 1400 × 1000. -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="commun.css">
<style>
  .feuille { inset: 24px 28px 28px 24px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(120,90,50,.25) inset;
    background:
      linear-gradient(90deg, transparent 33%, rgba(120,90,50,.10) 33.3%, rgba(255,255,255,.15) 33.6%, transparent 34.5%),
      linear-gradient(90deg, transparent 66%, rgba(120,90,50,.10) 66.3%, rgba(255,255,255,.15) 66.6%, transparent 67.5%),
      radial-gradient(ellipse at 50% 50%, #f4ead3 55%, #e3cfa6 100%); }
  .carte { position: absolute; inset: 0; width: 100%; height: 100%; }
  .titre { position: absolute; top: 40px; left: 60px; font-family: 'IM Fell English SC', serif; font-size: 50px;
    letter-spacing: 5px; color: var(--encre); }
  .sous { position: absolute; top: 104px; left: 64px; font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 27px; color: var(--encre-pale); }
  .nom { position: absolute; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600;
    font-size: 34px; color: #3f2a1c; white-space: nowrap; }
  .age { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply;
    background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(160,115,55,.30) 100%),
      radial-gradient(ellipse 10% 9% at 86% 80%, rgba(150,105,50,.22), transparent 70%),
      linear-gradient(180deg, rgba(215,175,95,.14), rgba(200,155,80,.2)); }
</style></head>
<body>
<div class="feuille">
  <svg class="grain" xmlns="http://www.w3.org/2000/svg"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="61"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0.3 0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  <svg class="carte" viewBox="0 0 1348 948" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="plume" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="6" result="b"/><feDisplacementMap in="SourceGraphic" in2="b" scale="2.4"/></filter>
      <filter id="encre" x="-40%" y="-40%" width="180%" height="180%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="22"/></filter>
      <pattern id="vagues" width="90" height="56" patternUnits="userSpaceOnUse">
        <path d="M7 22q13-5 26 0m19 25q10-4 21 0" fill="none" stroke="#7d9792" stroke-opacity=".3" stroke-width="2"/>
      </pattern>
      <path id="phare" d="m393 464 17-31 37-8 22 18 30-4 25 16-35 20-12 23-34 10-28 27-14-13 12-22-28-9z"/>
      <path id="reveil" d="m245 717 29-29 34 3 23 19-16 14 6 23-25 15-36-5-18-24z"/>
      <path id="colonie" d="m588 617 22-36 63-22 37 9 44 30-10 25 18 23-31 34-47 14-14-17-42-4-42-31z"/>
      <path id="quarantaine" d="m675 268 22-23 45 9 19-19 26 17 17 28-17 26-36 1-33 21-46-19z"/>
      <path id="nef" d="m453 193 22-20 32 5 22 18-3 34-24 30-35-2-24-27z"/>
      <path id="centrale" d="m177 371 27-32 42 4 24 22-8 25-39 8-19 18-25-14z"/>
    </defs>
    <!-- La mer, l'aquarelle bleu pâle -->
    <path d="M70 160 Q600 130 1280 150 L1270 880 Q700 905 80 885 Z" fill="#d6e2d6" opacity=".8"/>
    <path d="M70 160 Q600 130 1280 150 L1270 880 Q700 905 80 885 Z" fill="url(#vagues)"/>
    <g transform="translate(250 60) scale(1.0 .92)" filter="url(#plume)">
      <!-- Les routes des barques entre les îles -->
      <g fill="none" stroke="#8a6a4f" stroke-width="2.2" stroke-dasharray="4 10" stroke-linecap="round" opacity=".65">
        <path d="M650 600 Q560 520 470 470"/>
        <path d="M470 470 Q380 590 290 705"/>
        <path d="M470 470 Q480 330 490 215"/>
        <path d="M700 580 Q720 430 725 290"/>
        <path d="M445 470 Q330 420 225 380"/>
        <path d="M620 650 Q450 720 330 720"/>
      </g>
      <g stroke="#5a412c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <use href="#phare" fill="#dfc185"/>
        <use href="#reveil" fill="#b4c59a"/>
        <use href="#colonie" fill="#d3b98f"/>
        <use href="#quarantaine" fill="#f6efe0"/>
        <use href="#nef" fill="#c6a497"/>
        <use href="#centrale" fill="#afc2b8"/>
      </g>
      <!-- Le Phare, la Colonie : un petit soleil chacun, une lanterne -->
      <g fill="#e6b85a" stroke="#9a6a2a" stroke-width="2">
        <circle cx="445" cy="460" r="8"/><circle cx="660" cy="610" r="8"/><circle cx="215" cy="375" r="7"/>
      </g>
      <!-- La tache d'encre, au nord-ouest : là où devrait être une île -->
      <g filter="url(#encre)">
        <ellipse cx="120" cy="150" rx="30" ry="22" fill="#2f2018" opacity=".85"/>
        <circle cx="160" cy="132" r="7" fill="#2f2018" opacity=".8"/>
        <circle cx="96" cy="182" r="5" fill="#2f2018" opacity=".75"/>
      </g>
    </g>
    <!-- La rose des vents -->
    <g transform="translate(1160 760)" fill="none" stroke="#8a6a4f" stroke-width="2.2" filter="url(#plume)">
      <circle r="48"/><path d="M0 -70 L10 -10 L0 0 L-10 -10 Z" fill="#c89a3f"/><path d="M0 70 L10 10 L0 0 L-10 10 Z"/>
      <path d="M-70 0 L-10 -10 L0 0 L-10 10 Z"/><path d="M70 0 L10 -10 L0 0 L10 10 Z"/>
    </g>
    <text x="1152" y="672" font-family="IM Fell English SC" font-size="30" fill="#4f3624">N</text>
  </svg>
  <div class="titre">Archipel des Semeurs</div>
  <div class="sous">relevé par l'équipage de la Nef, à l'arrivée</div>
  <div class="nom" style="left:870px; top:682px">la Colonie</div>
  <div class="nom" style="left:640px; top:522px">le Phare</div>
  <div class="nom" style="left:930px; top:362px">l'île blanche</div>
  <div class="nom" style="left:700px; top:176px">la Nef</div>
  <div class="nom" style="left:390px; top:446px">la Centrale</div>
  <div class="nom" style="left:460px; top:772px">l'île du Réveil</div>
  <div class="age"></div>
</div>
</body></html>
