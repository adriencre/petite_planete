<!doctype html>
<!-- Les ordres de la Commandante, sur la table du bureau d'Ysolde, maison commune de la Colonie
     (ILE_03_COLONIE.md §7, validés le 2026-11-16). Un registre d'ordres : trois minutes datées,
     l'écriture se resserre d'un ordre à l'autre. Rendu : 1000 × 1300. -->
<html lang="fr"><head><meta charset="utf-8">
<link rel="stylesheet" href="commun.css">
<style>
  .feuille { inset: 30px 36px 34px 32px; transform: rotate(-.7deg); border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(120,90,50,.25) inset;
    background:
      repeating-linear-gradient(180deg, transparent 0 63px, rgba(140,160,170,.20) 63px 65px),
      radial-gradient(ellipse at 50% 50%, #f6eedb 55%, #e6d5b1 100%); }
  .marge { position: absolute; top: 0; bottom: 0; left: 128px; border-left: 2px solid rgba(181,88,63,.35); }
  .tete { position: absolute; top: 46px; left: 150px; right: 50px; }
  .tete .t { font-family: 'IM Fell English SC', serif; font-size: 40px; letter-spacing: 5px; color: var(--encre); }
  .tete .s { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 25px; color: var(--encre-pale); }
  .ordre { position: absolute; left: 150px; right: 60px; color: #3f2a1c; }
  .ordre .date { position: absolute; left: -128px; width: 112px; text-align: right; font-family: 'Cormorant Garamond', serif;
    font-style: italic; font-size: 22px; color: var(--encre-pale); line-height: 1.2; top: 10px; }
  .ordre .texte { font-family: 'Dancing Script', cursive; font-weight: 600; }
  .o1 { top: 228px; } .o1 .texte { font-size: 52px; line-height: 64px; }
  .o2 { top: 548px; } .o2 .texte { font-size: 50px; line-height: 64px; }
  .o3 { top: 868px; } .o3 .texte { font-size: 62px; line-height: 64px; transform: rotate(-1.5deg); }
  .paraphe { font-family: 'Mrs Saint Delafield', cursive; font-size: 66px; color: #3f2a1c; text-align: right; margin-top: 4px; }
  .rature { text-decoration: line-through; text-decoration-thickness: 3px; opacity: .65; }
  .tampon { position: absolute; right: 60px; top: 46px; width: 130px; height: 130px; opacity: .55; transform: rotate(12deg); }
  .age { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply;
    background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(160,115,55,.28) 100%),
      radial-gradient(ellipse 12% 8% at 70% 64%, rgba(110,80,45,.22), transparent 70%),
      linear-gradient(180deg, rgba(215,175,95,.14), rgba(200,155,80,.2)); }
</style></head>
<body>
<div class="feuille">
  <svg class="grain" xmlns="http://www.w3.org/2000/svg"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="44"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0 0.25  0 0 0 0.3 0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  <div class="marge"></div>
  <div class="tete">
    <div class="t">Registre des ordres</div>
    <div class="s">de la Commandante de la Colonie</div>
  </div>
  <svg class="tampon" viewBox="-50 -50 100 100"><g fill="none" stroke="#a8432f" stroke-width="3" stroke-linecap="round"><circle r="44"/><circle r="30"/><path d="M0 -38 v-8 M0 38 v8 M-38 0 h-8 M38 0 h8"/><path d="M0 18 C-2 6 2 -4 0 -14"/><path d="M0 -2 C-10 -4 -16 -12 -16 -20 C-6 -18 0 -12 0 -2 Z"/></g></svg>

  <div class="ordre o1">
    <div class="date">avant la<br>saison sombre</div>
    <div class="texte">Doubler les lanternes de la ville haute avant la saison sombre.</div>
    <div class="paraphe">Ysolde</div>
  </div>
  <div class="ordre o2">
    <div class="date">plus tard</div>
    <div class="texte">Les malades seront envoyés à l'île blanche <span class="rature">pour</span> jusqu'à guérison.</div>
    <div class="paraphe">Ysolde</div>
  </div>
  <div class="ordre o3">
    <div class="date">le dernier<br>jour</div>
    <div class="texte">La Nef est réparée.<br>Nous partons.</div>
    <div class="paraphe">Y.</div>
  </div>
  <div class="age"></div>
</div>
</body></html>
