<body>
<main class="feuille lettre">
<p>Ysolde,</p>
<p>Tu me demandes encore des lanternes pour l&#x27;île blanche. Je ne les poserai pas.</p>
<p>J&#x27;ai vu ce qu&#x27;elles font là-bas. Demande à Saule ce qu&#x27;elle a vu, elle.</p>
<p>Éteins une seule nuit, avec moi. Une seule. Tu verras ce que je vois.</p>
<span class="signe">— Iris</span>
</main>
