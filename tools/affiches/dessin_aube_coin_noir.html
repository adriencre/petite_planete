<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Là où mes amis dansent</title>
<link rel="stylesheet" href="commun.css">
<link rel="stylesheet" href="papiers_phare.css">
</head>
<body>
<main class="feuille dessin">
<svg viewBox="0 0 630 390" role="img" aria-label="Dessin d’Aube : entre l’école et sa maison, un trou dans les pavés ; des marches descendent dans le noir, sous la terre, où elle danse avec ses amis">
<!-- le dessus : l'école (long toit bleu, clocheton) à gauche, sa maison haute (toit vert) à droite -->
<path d="m40 150 4-62 190 2 2 60z" fill="#efb59a" opacity=".85"/>
<path d="m30 92 110-40 110 40z" fill="#6f8aa0" stroke="#4f6a80" stroke-width="5" stroke-linejoin="round"/>
<path d="m130 56 2-26 16 0 2 24" fill="#d9a35c" stroke="#8a6d55" stroke-width="4"/>
<path d="m60 104h24v30h-24zm54 0h24v30h-24zm54 0h24v30h-24z" fill="#cfe2dc" stroke="#916853" stroke-width="3"/>
<path d="m430 152 2-104 70 2 2 102z" fill="#7d93a8" opacity=".85"/>
<path d="m420 54 48-40 48 38z" fill="#93ac92" stroke="#6b7f6a" stroke-width="5" stroke-linejoin="round"/>
<path d="m452 76 22 0v20h-22z" fill="#cfe2dc" stroke="#5e6f86" stroke-width="3"/>
<!-- le sol de la ruelle, avec ses pavés, et le trou -->
<path d="M20 156q150-8 300 0t290 0" fill="none" stroke="#8fae7c" stroke-width="9" stroke-linecap="round" opacity=".7"/>
<path d="m262 150 24-6m50 4 26 4m-140 2 18-3m184 1 20 3" stroke="#a89582" stroke-width="6" stroke-linecap="round"/>
<path d="m290 152 50 0 8 10-66 0z" fill="#2e2538"/>
<!-- les marches qui descendent sous la terre -->
<path d="M300 160v22h-14v22h-14v22h-14v22h-14v20" fill="none" stroke="#8a6d65" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<!-- la terre, en coupe, et la grotte toute noire en dessous -->
<path d="M20 170q150 6 300 0t290 0" fill="none" stroke="#b99a7f" stroke-width="3" stroke-dasharray="8 10" opacity=".7"/>
<path d="M232 300q-6-48 58-56 40-4 100 4 96 10 110 50 8 40-60 50-150 8-196 0-24-8-12-48z" fill="#2e2538"/>
<path d="m246 286 10-10m-4 22 12-6m214-12 12 8m-20 16 14 2" stroke="#8a6a58" stroke-width="4" stroke-linecap="round"/>
<!-- Aube, et ses amis qui dansent en rond autour d'elle -->
<circle cx="376" cy="296" r="11" fill="#dcb194" stroke="#8e7167" stroke-width="4"/>
<path d="M367 291q8-12 18-1" fill="none" stroke="#66536e" stroke-width="5" stroke-linecap="round"/>
<path d="m362 330 5-24h18l5 24z" fill="#e8a7b2" stroke="#a87482" stroke-width="4" stroke-linejoin="round"/>
<g fill="#ffe08a" stroke="#f6c860" stroke-width="3">
<circle cx="326" cy="300" r="9"/><circle cx="342" cy="270" r="9"/><circle cx="376" cy="258" r="10"/>
<circle cx="410" cy="270" r="9"/><circle cx="428" cy="302" r="9"/><circle cx="410" cy="330" r="8"/><circle cx="340" cy="330" r="8"/>
</g>
<g fill="#4d4a6e">
<circle cx="323" cy="298" r="1.8"/><circle cx="329" cy="298" r="1.8"/><circle cx="339" cy="268" r="1.8"/><circle cx="345" cy="268" r="1.8"/>
<circle cx="373" cy="256" r="1.8"/><circle cx="379" cy="256" r="1.8"/><circle cx="407" cy="268" r="1.8"/><circle cx="413" cy="268" r="1.8"/>
<circle cx="425" cy="300" r="1.8"/><circle cx="431" cy="300" r="1.8"/>
</g>
<!-- la flèche : c'est là, dessous -->
<path d="M206 196q20 40 50 70m0 0-3-16m3 16-15-4" fill="none" stroke="#aa7357" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<!-- un cœur -->
<path d="M548 210q12-16 26 0q12-16 26 0q0 20-26 34q-26-14-26-34z" fill="#f3a6b5" stroke="#8a6170" stroke-width="4"/>
</svg>
<p>Là où mes amis dansent.</p>
</main>
</body>
</html>
