<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ma cachette sous l’escalier</title>
<link rel="stylesheet" href="commun.css">
<link rel="stylesheet" href="papiers_phare.css">
</head>
<body>
<main class="feuille dessin">
<svg viewBox="0 0 630 390" role="img" aria-label="Dessin d’Aube : sa maison, l’escalier de pierre et la petite porte cachée dessous">
<!-- le sol, au crayon vert -->
<path d="M40 332q120-12 250 0t300-4" fill="none" stroke="#8fae7c" stroke-width="11" stroke-linecap="round" opacity=".7"/>
<!-- la maison haute, bleu ardoise, toit vert sauge -->
<path d="m338 330 4-226 118 3 2 223z" fill="#7d93a8" opacity=".78"/>
<path d="m328 110 70-74 74 72z" fill="#93ac92" stroke="#6b7f6a" stroke-width="5" stroke-linejoin="round"/>
<!-- la lucarne de sa chambre, avec ses dessins collés -->
<path d="m372 142 52 1-1 46-51-1z" fill="#cfe2dc" stroke="#5e6f86" stroke-width="5"/>
<path d="m380 152 14-1 1 13-14 1zm21 8 13 1-2 14-12-2z" fill="#eab4a5"/>
<!-- l'escalier de pierre qui monte vers la porte -->
<path d="m140 330 196-128 4 128z" fill="#d7b9a6" opacity=".55"/>
<path d="M140 330h30v-18h28v-18h28v-19h28v-18h28v-19h28v-19h22" fill="none" stroke="#8a6d65" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<path d="m342 190 24-1 1 38-25 1z" fill="#a67b62" stroke="#6f5048" stroke-width="5"/>
<path d="m338 208 32-4" stroke="#6f5048" stroke-width="6" stroke-linecap="round"/>
<!-- le dessous de l'escalier : le noir, et la petite porte d'enfant -->
<path d="m196 330 136-88 2 88z" fill="#5d5568" opacity=".72"/>
<path d="m292 330 1-34q12-14 24 0l1 34z" fill="#e0a36f" stroke="#6f5048" stroke-width="5" stroke-linejoin="round"/>
<circle cx="310" cy="314" r="3.5" fill="#6f5048"/>
<!-- les amis, dans le noir : juste des yeux -->
<g fill="#fff6dc">
<circle cx="232" cy="312" r="4"/><circle cx="243" cy="312" r="4"/>
<circle cx="262" cy="298" r="3.5"/><circle cx="272" cy="299" r="3.5"/>
<circle cx="250" cy="322" r="3"/><circle cx="259" cy="322" r="3"/>
</g>
<!-- Aube, à quatre pattes devant la petite porte -->
<circle cx="214" cy="292" r="11" fill="#dcb194" stroke="#8e7167" stroke-width="4"/>
<path d="M205 287q8-14 19-2" fill="none" stroke="#66536e" stroke-width="5" stroke-linecap="round"/>
<path d="m198 304 34-4 6 22-38 4z" fill="#e8a7b2" stroke="#a87482" stroke-width="4" stroke-linejoin="round"/>
<path d="m204 326-3 6m30-10 3 8" stroke="#8e7167" stroke-width="4" stroke-linecap="round"/>
<!-- la flèche -->
<path d="M196 222q70-20 98 66m0 0-11-15m11 15 4-18" fill="none" stroke="#aa7357" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<!-- le soleil du matin -->
<path d="m540 62-10 18-18-4 14 14-5 19 17-11 17 9-6-19 12-14-18 2z" fill="none" stroke="#d9a35c" stroke-width="6" stroke-linejoin="round"/>
</svg>
<p>Ma cachette sous l’escalier. Chut !</p>
</main>
</body>
</html>
