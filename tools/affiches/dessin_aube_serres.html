<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Les serres vues d’en haut</title>
<link rel="stylesheet" href="commun.css">
<link rel="stylesheet" href="papiers_phare.css">
</head>
<body>
<main class="feuille dessin">
<svg viewBox="0 0 630 390" role="img" aria-label="Dessin d’Aube : les serres et les arbres roses vus d’en haut, la grande lampe, et des toits sous l’eau">
<!-- la mer en bas, avec des petits toits dessous -->
<path d="M40 300Q160 280 300 300T600 296L600 370 40 370z" fill="#7fc3c0" opacity=".55"/>
<path d="m140 330 22-16 22 16zm90 14 20-14 20 14zm170-8 24-17 24 17zm90 16 18-12 18 12z" fill="#b86d62" opacity=".5"/>
<path d="M60 318q40-8 80 0m300 2q50-10 100 0" fill="none" stroke="#5f9ea0" stroke-width="5" stroke-linecap="round" opacity=".6"/>
<!-- les trois serres -->
<path d="M70 50h130v70H70zM250 40h130v70H250zM430 50h130v70H430z" fill="#cfe8e6" stroke="#5d8d96" stroke-width="6" stroke-linejoin="round"/>
<path d="M113 50v70m44-70v70M293 40v70m44-70v70M473 50v70m44-70v70" stroke="#5d8d96" stroke-width="3"/>
<!-- les arbres roses qui penchent tous vers la lampe -->
<path d="M110 100l22 30M160 100l10 32M290 92l14 36M330 92l-6 36M470 100l-12 32M520 100l-24 30" stroke="#8a5a48" stroke-width="7" stroke-linecap="round"/>
<g fill="#f2a3b8" stroke="#c0697f" stroke-width="3">
<circle cx="138" cy="140" r="17"/><circle cx="173" cy="143" r="16"/><circle cx="306" cy="140" r="17"/>
<circle cx="322" cy="141" r="15"/><circle cx="456" cy="143" r="16"/><circle cx="490" cy="140" r="17"/>
</g>
<!-- le grand mur et la lampe derrière, avec ses rayons -->
<path d="M90 200q230-26 450 0" fill="none" stroke="#c98d78" stroke-width="12" stroke-linecap="round"/>
<path d="m316 224 0 36" stroke="#557c86" stroke-width="7" stroke-linecap="round"/>
<circle cx="316" cy="222" r="14" fill="#ffd27a" stroke="#a9744f" stroke-width="4"/>
<path d="M316 196v-12m22 22 10-8m-54 8-10-8m54 26h13m-80 0h13" stroke="#e8b04f" stroke-width="5" stroke-linecap="round"/>
</svg>
<p>Les arbres regardent la grande lampe. Moi, d’en haut, je regarde les maisons sous l’eau.</p>
</main>
</body>
</html>
